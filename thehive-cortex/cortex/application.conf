# Configuracion de Cortex para el laboratorio TFM.
# Secreto interno de Play Framework (firma sesiones/cookies, no es una
# credencial de acceso). Fijo aqui en vez de via ${?CORTEX_SECRET}: la
# sustitucion de esa variable de entorno no llega de forma fiable al proceso
# de Cortex (probablemente por como el entrypoint de la imagen hace el
# cambio de usuario con 'su'), y un fallback corto sin la sustitucion
# aplicada se queda por debajo del minimo de 256 bits que exige Play para
# firmar JWT con HS256. 36 caracteres = 288 bits, sin esa dependencia.
play.http.secret.key = "Lab-Cortex-Secret-2026-Ficticio-POC"

## Elasticsearch propio de Cortex (no se comparte con el indexer de Wazuh)
search {
  index = cortex
  uri = "http://cortex-elasticsearch:9200"
}

cache.job = 10 minutes

# Los analizadores se ejecutan como contenedores Docker efimeros (requiere
# montar /var/run/docker.sock en el servicio 'cortex'; ver docs/architecture.md
# para la justificacion de ese privilegio, el unico de este tipo en el
# laboratorio).
# OJO: la clave es 'job.runners' (plural). Con 'job.runner' (singular) Cortex
# la ignora silenciosamente y usa su valor por defecto [docker, process], que
# coincide con lo que queremos igualmente -- pero mejor no dejar una clave
# que no hace nada.
job {
  runners = [docker]
}

## Catalogo oficial de analizadores/respondedores. Se descarga una vez y se
## cachea; los analizadores concretos (imagenes Docker) solo se descargan la
## primera vez que se invocan realmente.
analyzer {
  urls = [
    "https://download.thehive-project.org/analyzers.json"
  ]
}

responder {
  urls = [
    "https://download.thehive-project.org/responders.json"
  ]
}
