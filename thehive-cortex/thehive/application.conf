# Configuracion de TheHive para el laboratorio TFM.
# El secreto real se inyecta por variable de entorno (ver docker-compose.yml).
play.http.secret.key = "lab-thehive-secret-2026-fallback"
play.http.secret.key = ${?THEHIVE_SECRET}

## Almacenamiento embebido (BerkeleyDB + Lucene): sin Cassandra ni MinIO.
## Deliberadamente minimo para un laboratorio de un solo nodo; ver
## docs/architecture.md para la justificacion frente al despliegue de
## produccion de TheHive 5 (Cassandra + Elasticsearch + MinIO + Nginx).
db.janusgraph {
  storage.backend: berkeleyje
  storage.directory: /opt/thp/thehive/db
  berkeleyje.freeDisk: 200

  index {
    search {
      backend: lucene
      directory: /opt/thp/thehive/index
    }
  }
}

storage {
  provider: localfs
  localfs.location: /opt/thp/thehive/data
}

play.http.parser.maxDiskBuffer: 50MB

## Conexion con Cortex. La clave la escribe automaticamente el bootstrap
## 'cortex-org-bootstrap' (thehive-cortex/bootstrap/create_cortex_org.sh)
## antes de arrancar; el valor de abajo es solo el marcador de partida
## (README, docs/validation_plan.md §7.15).
play.modules.enabled += org.thp.thehive.connector.cortex.CortexModule
cortex {
  servers = [
    {
      name = local
      url = "http://cortex:9001"
      auth {
        type = "bearer"
        key = "Ms7FUwcOJntU96xIA85x/ktJuZTN+z2q"
      }
    }
  ]
  refreshDelay = 5 seconds
  maxRetryOnError = 3
  statusCheckInterval = 30 seconds
}
