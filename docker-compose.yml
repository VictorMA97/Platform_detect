services:
  # Bootstrap de certificados TLS, integrado en el ciclo de vida normal:
  # 'docker compose up -d' basta tanto en el primer arranque como en los
  # siguientes. La herramienta oficial no es idempotente (aborta si ya existen
  # certificados), asi que el entrypoint comprueba antes de invocarla; si el
  # volumen de certificados ya tiene contenido (p.ej. tras un 'down' sin '-v',
  # que no lo limpia por ser un bind mount), se omite sin error.
  wazuh-certs-generator:
    image: wazuh/wazuh-certs-generator:0.0.4
    hostname: wazuh-certs-generator
    networks:
      - wazuh-network
    environment:
      - CERT_TOOL_VERSION=4.14
    volumes:
      - ./config/wazuh_indexer_ssl_certs/:/certificates/
      - ./config/certs.yml:/config/certs.yml
    entrypoint:
      - sh
      - -c
      - |
        if [ -f /certificates/root-ca.pem ]; then
          echo "Certificados ya existentes en ./config/wazuh_indexer_ssl_certs/; no se regeneran."
        else
          /entrypoint.sh
        fi

  # Normaliza los permisos del volumen de certificados: el generador los deja
  # legibles solo por su propio UID, y los tres nodos Wazuh corren con UID
  # distintos. Idempotente (chmod), se ejecuta siempre tras el generador.
  wazuh-certs-permissions:
    image: alpine:3.20
    networks:
      - wazuh-network
    depends_on:
      wazuh-certs-generator:
        condition: service_completed_successfully
    volumes:
      - ./config/wazuh_indexer_ssl_certs/:/certificates/
    entrypoint: ["sh", "-c", "chmod -R a+rX /certificates"]

  wazuh.manager:
    image: wazuh/wazuh-manager:${WAZUH_STACK_VERSION:?falta WAZUH_STACK_VERSION en .env}
    hostname: wazuh.manager
    restart: always
    depends_on:
      wazuh-certs-permissions:
        condition: service_completed_successfully
    networks:
      - wazuh-network
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    environment:
      - INDEXER_URL="https://wazuh.indexer:9200"
      - INDEXER_USERNAME=${INDEXER_USERNAME:?falta INDEXER_USERNAME en .env}
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:?falta INDEXER_PASSWORD en .env}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=${API_USERNAME:?falta API_USERNAME en .env}
      - API_PASSWORD=${API_PASSWORD:?falta API_PASSWORD en .env}
    volumes:
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - filebeat_var:/var/lib/filebeat
      - ./config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
      - ./config/wazuh_cluster/local_rules.xml:/var/ossec/etc/rules/local_rules.xml
      - ./config/wazuh_cluster/integrations/custom-w2thive:/var/ossec/integrations/custom-w2thive:ro
      - ./config/wazuh_cluster/integrations/custom-w2thive.py:/var/ossec/integrations/custom-w2thive.py:ro
      - ./thehive-cortex/shared:/var/ossec/integrations/shared:ro

  wazuh.indexer:
    image: wazuh/wazuh-indexer:${WAZUH_STACK_VERSION:?falta WAZUH_STACK_VERSION en .env}
    hostname: wazuh.indexer
    restart: always
    depends_on:
      wazuh-certs-permissions:
        condition: service_completed_successfully
    networks:
      - wazuh-network
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
      - ./config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ./config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml
  
  victim:
    build:
      context: ./victim
      args:
        WAZUH_VERSION: ${WAZUH_AGENT_PACKAGE_VERSION:?falta WAZUH_AGENT_PACKAGE_VERSION en .env}
    hostname: agent-poc-1
    restart: always
    environment:
      # Nombre del servicio en esta misma red Docker: no es una credencial ni
      # un dato variable entre entornos, se deja fijo (cambiarlo exigiria
      # renombrar tambien el servicio wazuh.manager).
      WAZUH_MANAGER_SERVER: wazuh.manager
      WAZUH_REGISTRATION_SERVER: wazuh.manager
      WAZUH_AGENT_GROUP: ${WAZUH_AGENT_GROUP:?falta WAZUH_AGENT_GROUP en .env}
      WAZUH_AGENT_NAME: ${WAZUH_AGENT_NAME:?falta WAZUH_AGENT_NAME en .env}
      LAB_USER: ${LAB_USER:?falta LAB_USER en .env}
      LAB_PASSWORD: ${LAB_PASSWORD:?falta LAB_PASSWORD en .env}
      LAB_ALLOW_SUDO: ${LAB_ALLOW_SUDO:?falta LAB_ALLOW_SUDO en .env}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - wazuh-network
    volumes:
      - agent-etc:/var/ossec/etc
      - agent-queue:/var/ossec/queue
      - ./victim/scripts-active-response:/opt/ar-src:ro
      - ./evidence:/var/ossec/evidence
      - ./baseline:/opt/baseline:ro
    ports:
      - "2222:22"
    depends_on:
      - wazuh.manager

  attacker:
    build:
      context: ./attacker
    hostname: attacker-kali
    networks:
      - wazuh-network
    tty: true
    stdin_open: true
    volumes:
      - ./results:/opt/results

  # --- TheHive + Cortex: gestion de incidentes y analisis de artefactos ---
  # Stack deliberadamente minimo (TheHive con almacenamiento embebido
  # BerkeleyDB+Lucene, sin Cassandra/MinIO) frente al despliegue de
  # produccion de TheHive 5. Justificacion en docs/architecture.md.

  cortex-elasticsearch:
    image: elasticsearch:${CORTEX_ELASTICSEARCH_VERSION:?falta CORTEX_ELASTICSEARCH_VERSION en .env}
    hostname: cortex-elasticsearch
    restart: always
    networks:
      - wazuh-network
    environment:
      - http.host=0.0.0.0
      - discovery.type=single-node
      - cluster.name=cortex
      - script.allowed_types=inline
      - thread_pool.search.queue_size=100000
      - thread_pool.write.queue_size=10000
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - cortex-elasticsearch-data:/usr/share/elasticsearch/data

  # Ejecuta analizadores como contenedores Docker efimeros: requiere el
  # socket de Docker del host. Es el unico servicio del laboratorio con
  # ese privilegio; justificacion y alcance en docs/architecture.md.
  # Docker crea /tmp/cortex-jobs como root:root 0755 al montarlo por primera
  # vez (es un bind mount de host, no un volumen con nombre), pero Cortex
  # corre como UID/GID 1001 y necesita poder crear subdirectorios ahi dentro
  # para cada trabajo de analizador -- mismo patron que thehive-volume-permissions.
  # Sin esto, los analizadores fallan con un AccessDeniedException al crear
  # el directorio del trabajo (el mensaje de la excepcion es solo la ruta,
  # sin mas detalle, lo que lo hace facil de confundir con otro problema).
  cortex-jobs-permissions:
    image: alpine:3.20
    networks:
      - wazuh-network
    volumes:
      - /tmp/cortex-jobs:/tmp/cortex-jobs
    entrypoint: ["sh", "-c", "chown -R 1001:1001 /tmp/cortex-jobs"]

  cortex:
    image: thehiveproject/cortex:${CORTEX_VERSION:?falta CORTEX_VERSION en .env}
    hostname: cortex
    restart: always
    depends_on:
      cortex-elasticsearch:
        condition: service_started
      cortex-jobs-permissions:
        condition: service_completed_successfully
    networks:
      - wazuh-network
    environment:
      - CORTEX_SECRET=${CORTEX_SECRET:?falta CORTEX_SECRET en .env}
      # Cortex construye siempre un cliente de Kubernetes al arrancar (aunque
      # solo se use el runner 'docker'), y sin estas variables intenta
      # resolver por DNS 'kubernetes.default.svc' -- que no existe fuera de
      # un cluster real y tira todo el arranque con UnknownHostException.
      # Con estas variables el cliente usa esta direccion directamente, sin
      # DNS, y falla rapido con 'conexion rechazada' en vez de colgarse.
      - KUBERNETES_SERVICE_HOST=127.0.0.1
      - KUBERNETES_SERVICE_PORT=443
    extra_hosts:
      - "kubernetes.default.svc:127.0.0.1"
    volumes:
      - ./thehive-cortex/cortex/application.conf:/etc/cortex/application.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # Mismo path a los dos lados, a proposito: es el directorio de trabajo
      # de los analizadores (job.directory en application.conf), y el daemon
      # del host necesita poder resolver esa misma ruta al montarla, a su
      # vez, dentro de cada contenedor de analizador. Ver el comentario junto
      # a 'job.directory' en thehive-cortex/cortex/application.conf.
      - /tmp/cortex-jobs:/tmp/cortex-jobs
    ports:
      - "9001:9001"
    # --secret es la via nativa del entrypoint de la imagen para fijar el
    # secreto (independiente de si ${?CORTEX_SECRET} llega o no al proceso
    # de Cortex via variable de entorno -- ver el comentario en
    # thehive-cortex/cortex/application.conf, que ya trae un secreto fijo
    # de sobra largo como red de seguridad).
    command: ["--secret", "${CORTEX_SECRET:?falta CORTEX_SECRET en .env}"]

  # Bootstrap de un solo uso: hace por API todo lo que antes era manual en la
  # UI de Cortex (inicializar la base de datos, crear organizacion y usuario
  # analista, habilitar FileInfo, generar su clave) y la escribe directamente
  # en thehive/application.conf. Ver el comentario al principio de
  # create_cortex_org.sh para el porque de cada paso (confirmado leyendo el
  # codigo fuente de Cortex 3.2.1, no por prueba y error) y
  # docs/validation_plan.md §7.15 para la verificacion en vivo.
  cortex-org-bootstrap:
    image: curlimages/curl:8.10.1
    networks:
      - wazuh-network
    depends_on:
      cortex:
        condition: service_started
    environment:
      - CORTEX_ADMIN_USER=${CORTEX_ADMIN_USER:?falta CORTEX_ADMIN_USER en .env}
      - CORTEX_ADMIN_PASSWORD=${CORTEX_ADMIN_PASSWORD:?falta CORTEX_ADMIN_PASSWORD en .env}
      - CORTEX_ANALYST_USER=${CORTEX_ANALYST_USER:?falta CORTEX_ANALYST_USER en .env}
      - CORTEX_ANALYST_PASSWORD=${CORTEX_ANALYST_PASSWORD:?falta CORTEX_ANALYST_PASSWORD en .env}
    volumes:
      - ./thehive-cortex/bootstrap/create_cortex_org.sh:/create_cortex_org.sh:ro
      # Se monta el directorio completo, no solo el fichero: el reemplazo de
      # la clave se hace escribiendo aparte + moviendo (atomico), y eso
      # necesita poder crear un fichero nuevo en el mismo directorio, no
      # solo escribir sobre el punto de montaje de un bind mount de un unico
      # fichero. Directorio a 777 (ver thehive-cortex/thehive/, mismo motivo
      # que thehive-cortex/shared/ en el bootstrap de Wazuh->TheHive):
      # curlimages/curl corre como UID 100, no el propietario del host.
      - ./thehive-cortex/thehive:/thehive-application-conf
    entrypoint: ["sh", "/create_cortex_org.sh"]

  # Normaliza el dueno de los volumenes de TheHive: Docker los crea como
  # root, pero el proceso de thehive corre como UID/GID 1000 (usuario
  # 'thehive' de la imagen) y no puede escribir en ellos sin esto.
  # Mismo patron que wazuh-certs-permissions.
  thehive-volume-permissions:
    image: alpine:3.20
    networks:
      - wazuh-network
    volumes:
      - thehive-db:/opt/thp/thehive/db
      - thehive-index:/opt/thp/thehive/index
      - thehive-data:/opt/thp/thehive/data
    entrypoint: ["sh", "-c", "chown -R 1000:1000 /opt/thp/thehive/db /opt/thp/thehive/index /opt/thp/thehive/data"]

  thehive:
    image: thehiveproject/thehive4:${THEHIVE_VERSION:?falta THEHIVE_VERSION en .env}
    hostname: thehive
    restart: always
    depends_on:
      cortex:
        condition: service_started
      thehive-volume-permissions:
        condition: service_completed_successfully
      cortex-org-bootstrap:
        condition: service_completed_successfully
    networks:
      - wazuh-network
    environment:
      - THEHIVE_SECRET=${THEHIVE_SECRET:?falta THEHIVE_SECRET en .env}
    volumes:
      - ./thehive-cortex/thehive/application.conf:/etc/thehive/application.conf:ro
      - thehive-db:/opt/thp/thehive/db
      - thehive-index:/opt/thp/thehive/index
      - thehive-data:/opt/thp/thehive/data
    command: --no-config --no-config-secret
    ports:
      - "9000:9000"

  # Bootstrap de un solo uso: genera una clave API en TheHive para que la
  # integracion Wazuh->TheHive (custom-w2thive) pueda autenticarse sin
  # intervencion manual. No bloquea el resto del laboratorio (sin
  # depends_on desde wazuh.manager): si tarda o falla, la integracion
  # queda inactiva hasta que la clave aparezca, pero el ciclo
  # ataque->alerta->respuesta->evidencia no depende de ella.
  thehive-wazuh-bootstrap:
    image: curlimages/curl:8.10.1
    networks:
      - wazuh-network
    depends_on:
      - thehive
    volumes:
      - ./thehive-cortex/bootstrap/create_wazuh_api_key.sh:/create_wazuh_api_key.sh:ro
      - ./thehive-cortex/shared:/shared
    entrypoint: ["sh", "/create_wazuh_api_key.sh"]

networks:
  wazuh-network:
    driver: bridge

volumes:
  agent-etc:
  agent-queue:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  filebeat_var:
  wazuh-indexer-data:
  cortex-elasticsearch-data:
  thehive-db:
  thehive-index:
  thehive-data:
