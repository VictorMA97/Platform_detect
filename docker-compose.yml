services:
  # Bootstrap de certificados TLS, integrado en el ciclo de vida normal:
  # 'docker compose up -d' basta tanto en el primer arranque como en los
  # siguientes. La herramienta oficial no es idempotente (aborta si ya existen
  # certificados), asi que el entrypoint comprueba antes de invocarla; si el
  # volumen de certificados ya tiene contenido (p.ej. tras un 'down' sin '-v',
  # que no lo limpia por ser un bind mount), se omite sin error.
  wazuh-certs-generator:
    image: wazuh/wazuh-certs-generator:0.0.4
    hostname: wazuh-certs-generator
    networks:
      - wazuh-network
    environment:
      - CERT_TOOL_VERSION=4.14
    volumes:
      - ./config/wazuh_indexer_ssl_certs/:/certificates/
      - ./config/certs.yml:/config/certs.yml
    entrypoint:
      - sh
      - -c
      - |
        if [ -f /certificates/root-ca.pem ]; then
          echo "Certificados ya existentes en ./config/wazuh_indexer_ssl_certs/; no se regeneran."
        else
          /entrypoint.sh
        fi

  # Normaliza los permisos del volumen de certificados: el generador los deja
  # legibles solo por su propio UID, y los tres nodos Wazuh corren con UID
  # distintos. Idempotente (chmod), se ejecuta siempre tras el generador.
  wazuh-certs-permissions:
    image: alpine:3.20
    networks:
      - wazuh-network
    depends_on:
      wazuh-certs-generator:
        condition: service_completed_successfully
    volumes:
      - ./config/wazuh_indexer_ssl_certs/:/certificates/
    entrypoint: ["sh", "-c", "chmod -R a+rX /certificates"]

  wazuh.manager:
    image: wazuh/wazuh-manager:${WAZUH_STACK_VERSION:?falta WAZUH_STACK_VERSION en .env}
    hostname: wazuh.manager
    restart: always
    depends_on:
      wazuh-certs-permissions:
        condition: service_completed_successfully
    networks:
      - wazuh-network
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    environment:
      - INDEXER_URL="https://wazuh.indexer:9200"
      - INDEXER_USERNAME=${INDEXER_USERNAME:?falta INDEXER_USERNAME en .env}
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:?falta INDEXER_PASSWORD en .env}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=${API_USERNAME:?falta API_USERNAME en .env}
      - API_PASSWORD=${API_PASSWORD:?falta API_PASSWORD en .env}
    volumes:
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - filebeat_var:/var/lib/filebeat
      - ./config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
      - ./config/wazuh_cluster/local_rules.xml:/var/ossec/etc/rules/local_rules.xml

  wazuh.indexer:
    image: wazuh/wazuh-indexer:${WAZUH_STACK_VERSION:?falta WAZUH_STACK_VERSION en .env}
    hostname: wazuh.indexer
    restart: always
    depends_on:
      wazuh-certs-permissions:
        condition: service_completed_successfully
    networks:
      - wazuh-network
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
      - ./config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ./config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml
  
  victim:
    build:
      context: ./victim
      args:
        WAZUH_VERSION: ${WAZUH_AGENT_PACKAGE_VERSION:?falta WAZUH_AGENT_PACKAGE_VERSION en .env}
    hostname: agent-poc-1
    restart: always
    environment:
      # Nombre del servicio en esta misma red Docker: no es una credencial ni
      # un dato variable entre entornos, se deja fijo (cambiarlo exigiria
      # renombrar tambien el servicio wazuh.manager).
      WAZUH_MANAGER_SERVER: wazuh.manager
      WAZUH_REGISTRATION_SERVER: wazuh.manager
      WAZUH_AGENT_GROUP: ${WAZUH_AGENT_GROUP:?falta WAZUH_AGENT_GROUP en .env}
      WAZUH_AGENT_NAME: ${WAZUH_AGENT_NAME:?falta WAZUH_AGENT_NAME en .env}
      LAB_USER: ${LAB_USER:?falta LAB_USER en .env}
      LAB_PASSWORD: ${LAB_PASSWORD:?falta LAB_PASSWORD en .env}
      LAB_ALLOW_SUDO: ${LAB_ALLOW_SUDO:?falta LAB_ALLOW_SUDO en .env}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - wazuh-network
    volumes:
      - agent-etc:/var/ossec/etc
      - agent-queue:/var/ossec/queue
      - ./victim/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - ./victim/scripts-active-response:/opt/ar-src:ro
      - ./evidence:/var/ossec/evidence
      - ./baseline:/opt/baseline:ro
    ports:
      - "2222:22"
    depends_on:
      - wazuh.manager

  attacker:
    build:
      context: ./attacker
    hostname: attacker-kali
    networks:
      - wazuh-network
    tty: true
    stdin_open: true
    volumes:
      - ./results:/opt/results

networks:
  wazuh-network:
    driver: bridge

volumes:
  agent-etc:
  agent-queue:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  filebeat_var:
  wazuh-indexer-data:
